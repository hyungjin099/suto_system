spring.application.name=auto_system



#\uB370\uC774\uD130\uBCA0\uC774\uC2A4 \uC5F0\uACB0 \uC815\uBCF4
#spring.datasource.driverClassName=org.mariadb.jdbc.Driver
#spring.datasource.url=jdbc:mariadb://localhost:3306/study_db
spring.datasource.driver-class-name=${DB_DRIVER:net.sf.log4jdbc.sql.jdbcapi.DriverSpy}
spring.datasource.url=${DB_URL:jdbc:log4jdbc:mariadb://localhost:3306/green}
spring.datasource.username=${DB_USERNAME:green_admin}
spring.datasource.password=${DB_PASSWORD:mariadb}


#\uCFFC\uB9AC\uBB38\uC774 \uC788\uB294 mapper \uD30C\uC77C \uC704\uCE58 \uC9C0\uC815, classpath\uB294 resources \uD3F4\uB354\uB97C \uC758\uBBF8\uD568
mybatis.mapper-locations=classpath:mapper/*.xml

#\uD55C \uD30C\uC77C\uC758 \uC6A9\uB7C9\uC744 5MB\uB85C \uC124\uC815
spring.servlet.multipart.max-file-size=10MB
#\uD55C \uBC88\uC5D0 \uC5C5\uB85C\uB4DC\uB418\uB294 \uC6A9\uB7C9\uC744 5MB\uB85C \uC124\uC815
spring.servlet.multipart.max-request-size=10MB

sheets.webhook.url=${SHEETS_WEBHOOK_URL:}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
#spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# CORS 허용 오리진 (콤마 구분). 운영 시 ALLOWED_ORIGINS 환경변수로 덮어쓰기
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# 세션 쿠키 보안 (운영 HTTPS에서는 COOKIE_SECURE=true)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=2h

